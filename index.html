  <script>
    const form = document.getElementById("unlock");
    const password = document.getElementById("password");
    const openButton = document.getElementById("open");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
    }

    function decodeBase64(encoded) {
      return Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
    }

    if (!globalThis.crypto?.subtle) {
      showMessage("Buka file langsung di browser atau gunakan tautan HTTPS.");
    } else {
      openButton.disabled = false;
      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (openButton.disabled) return;
        openButton.disabled = true;
        message.hidden = true;
        password.removeAttribute("aria-invalid");
        const passwordBytes = new TextEncoder().encode(password.value);
        password.value = "";

        try {
          const { salt, iv, iterations, data } = JSON.parse(document.getElementById("report-data").textContent);
          const secret = await crypto.subtle.importKey("raw", passwordBytes, "PBKDF2", false, ["deriveKey"]);
          const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", hash: "SHA-256", salt: decodeBase64(salt), iterations },
            secret,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          const clear = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: decodeBase64(iv) },
            key,
            decodeBase64(data)
          );
          const report = new DOMParser().parseFromString(new TextDecoder().decode(clear), "text/html");
          document.replaceChild(document.adoptNode(report.documentElement), document.documentElement);
          document.getElementById("print").addEventListener("click", () => window.print());
        } catch (error) {
          if (error.name === "OperationError") {
            showMessage("Password salah.");
            password.setAttribute("aria-invalid", "true");
          } else {
            showMessage("Laporan tidak bisa dibuka.");
          }
          openButton.disabled = false;
          password.focus();
        } finally {
          passwordBytes.fill(0);
        }
      });
    }
  </script>
